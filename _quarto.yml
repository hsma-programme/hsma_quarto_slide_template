project:
  title: "Title"
  # output-dir is deliberately NOT set here -- always pass it on the command
  # line instead (`quarto render --output-dir docs`, see README.md). Setting
  # it in this file makes Quarto anchor `quarto preview <file>` for any
  # ad-hoc file not in project.render (e.g. previewing a single
  # _SECTION_*.qmd on its own) at output-dir as its web root, even though
  # that file's own rendered output still lands next to the source at the
  # project root -- the preview server then can't actually serve it (browser
  # gets a broken /../<file>.html 404). See _docs_cleanup.py's docstring.
  execute-dir: project
  resources:
    - assets/

  # Only render the deck itself. Without this, Quarto also renders every other
  # top-level .md / .ipynb file (README, LICENCE, scratch notebooks) into
  # output-dir as its own standalone page.
  # NOTE: if you rename slides.qmd, change this to match.
  render:
    - slides.qmd

  # Regenerates assets/slides_qr.svg from the deck header's `qr-code:`
  # (`auto` = this repo's hosted deck, or a URL) -- see the script's docstring.
  pre-render:
    - _make_slides_qr.py

  # Quarto's default (non-website) project type copies the WHOLE project
  # directory into output-dir on every render, and it ignores .gitignore.
  # This hook deletes everything in output-dir that isn't listed in docs-keep
  # below. Please don't remove it -- without it, docs/ silently accumulates
  # your source files, data folders, __pycache__, lockfiles and multi-MB
  # Jupyter intermediates, and GitHub Pages publishes the lot.
  post-render:
    - _docs_vendor_widget_assets.py
    - _docs_cleanup.py

# Everything in output-dir NOT listed here is deleted after each render.
# Add any folder your deck links to at runtime -- extra images, PDFs, data
# files, handouts. If you drop an entry the deck actually needs, the deck
# breaks silently on the published site, so check it after editing this list.
docs-keep:
  - index.html
  - slides_files
  - assets
  - resources
  - diagrams
  - .nojekyll
  - _extensions
  - _freeze
  - custom.scss
  - title-slide.scss
  - title-slide.html
  - _brand.yml
  - code_examples
  - fullscreen
  - sample_code


format:
  revealjs:
    execute:
      freeze: auto
