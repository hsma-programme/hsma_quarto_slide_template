[project]
name = "hsma-quarto-slide-template"
version = "0.1.0"
description = "HSMA Quarto slide template"
requires-python = ">=3.9"
dependencies = [
    "jupyter",
    "nbconvert",
    "nbformat",
    "pyyaml",
    # Needed at render time by the executed ({python}, eval: true) example
    # cells. plotly.express additionally needs numpy (via the [express]
    # extra) and pandas. Code in {pyodide} and {stlite-python} cells runs in
    # the browser, so those imports (matplotlib, streamlit) aren't needed here.
    "plotly[express]",
    "pandas",
    # Pre-render QR code for the title slide (_make_slides_qr.py)
    "segno>=1.6.6",
]
